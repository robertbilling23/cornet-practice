<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brass Sight-Reading & Pitch Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 900px;
      text-align: center;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #94a3b8;
      gap: 4px;
      text-align: left;
    }
    select, input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    button.main-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 12px;
    }
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .score-correct { color: var(--success); }
    .score-wrong { color: var(--danger); }
    .score-acc { color: var(--accent); }

    #notation-wrapper {
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      margin: 20px 0;
      padding: 10px;
      overflow-x: auto;
    }
    #notation {
      display: inline-block;
    }
    #cursor {
      position: absolute;
      width: 45px;
      height: 110px;
      top: 25px;
      left: 0;
      background: rgba(56, 189, 248, 0.25);
      border: 2px solid var(--accent);
      border-radius: 6px;
      pointer-events: none;
      transition: left 0.08s ease-out;
      display: none;
    }
    .freq-display { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    /* Left-to-Right Fade Transition for Bar Regeneration */
    @keyframes ltrFade {
      0% {
        clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        opacity: 0.2;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
      }
    }
    .bar-animating {
      animation: ltrFade 0.45s ease-out forwards;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Brass Sight-Reading Trainer</h2>
  
  <div class="controls">
    <label>Instrument
      <select id="instrumentSelect">
        <option value="Bb">Trumpet / Cornet (B♭)</option>
        <option value="C">Trombone / Treble C</option>
      </select>
    </label>

    <label>Tempo (BPM): <span id="bpmVal">80</span>
      <input type="range" id="tempoSlider" min="40" max="180" value="80">
    </label>

    <button id="startBtn" class="main-btn">Start Practice</button>
  </div>

  <div class="scoreboard">
    <div>Correct: <span id="correctCnt" class="score-correct">0</span></div>
    <div>Wrong: <span id="wrongCnt" class="score-wrong">0</span></div>
    <div>Accuracy: <span id="accPct" class="score-acc">100%</span></div>
  </div>

  <div id="notation-wrapper">
    <div id="notation"></div>
    <div id="cursor"></div>
  </div>
  
  <div id="freqInfo" class="freq-display">Detected: -- Hz</div>
</div>

<script>
const VF = Vex.Flow;

// Note Pool: Low A (A3) to Third Space C (C5)
const NOTES = [
  { name: "A/3", key: "a/3", pitch: "A3", freq: 220.00 },
  { name: "B/3", key: "b/3", pitch: "B3", freq: 246.94 },
  { name: "C/4", key: "c/4", pitch: "C4", freq: 261.63 },
  { name: "D/4", key: "d/4", pitch: "d/4", freq: 293.66 },
  { name: "E/4", key: "e/4", pitch: "e/4", freq: 329.63 },
  { name: "F/4", key: "f/4", pitch: "f/4", freq: 349.23 },
  { name: "G/4", key: "g/4", pitch: "G4", freq: 392.00 },
  { name: "A/4", key: "a/4", pitch: "A4", freq: 440.00 },
  { name: "B/4", key: "b/4", pitch: "B4", freq: 493.88 },
  { name: "C/5", key: "c/5", pitch: "C5", freq: 523.25 }
];

let audioCtx, analyser, micStream;
let isRunning = false;
let metronomeTimer = null;

let activeNotes = []; // 12 note objects with status ('pending', 'correct', 'wrong')
let currentBeatIndex = -1;
let noteEvaluated = false;
let correctCount = 0;
let wrongCount = 0;
let pitchHoldCounter = 0;

let animatingBar = null;
let noteXPositions = [];

const startBtn = document.getElementById("startBtn");
const tempoSlider = document.getElementById("tempoSlider");
const bpmVal = document.getElementById("bpmVal");
const freqInfoEl = document.getElementById("freqInfo");
const instrumentSelect = document.getElementById("instrumentSelect");
const cursor = document.getElementById("cursor");

tempoSlider.oninput = () => {
  bpmVal.innerText = tempoSlider.value;
  if (isRunning) resetMetronome();
};

startBtn.onclick = async () => {
  if (isRunning) {
    stopApp();
  } else {
    await startApp();
  }
};

async function startApp() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    
    isRunning = true;
    startBtn.innerText = "Stop";
    startBtn.style.background = "var(--danger)";
    cursor.style.display = "block";
    
    resetStats();
    generateInitialNotes();
    renderScore();
    
    currentBeatIndex = -1;
    resetMetronome();
    detectPitch();
  } catch (err) {
    alert("Microphone access is required for pitch detection.");
  }
}

function stopApp() {
  isRunning = false;
  if (metronomeTimer) clearInterval(metronomeTimer);
  if (micStream) micStream.getTracks().forEach(track => track.stop());
  if (audioCtx) audioCtx.close();
  
  startBtn.innerText = "Start Practice";
  startBtn.style.background = "var(--accent)";
  cursor.style.display = "none";
  freqInfoEl.innerText = "Detected: -- Hz";
}

function resetStats() {
  correctCount = 0;
  wrongCount = 0;
  updateScoreboard();
}

function updateScoreboard() {
  document.getElementById("correctCnt").innerText = correctCount;
  document.getElementById("wrongCnt").innerText = wrongCount;
  const total = correctCount + wrongCount;
  const pct = total === 0 ? 100 : Math.round((correctCount / total) * 100);
  document.getElementById("accPct").innerText = `${pct}%`;
}

function getRandomNote() {
  const note = NOTES[Math.floor(Math.random() * NOTES.length)];
  return { ...note, status: 'pending' };
}

function generateInitialNotes() {
  activeNotes = [];
  for (let i = 0; i < 12; i++) {
    activeNotes.push(getRandomNote());
  }
}

function regenerateBar(barIndex) {
  for (let i = 0; i < 4; i++) {
    activeNotes[barIndex * 4 + i] = getRandomNote();
  }
  animatingBar = barIndex;
  renderScore();
}

function resetMetronome() {
  if (metronomeTimer) clearInterval(metronomeTimer);
  const intervalMs = (60 / parseInt(tempoSlider.value)) * 1000;
  
  advanceBeat();
  metronomeTimer = setInterval(advanceBeat, intervalMs);
}

function playClick() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = (currentBeatIndex % 4 === 0) ? 1200 : 800;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.04);
}

function advanceBeat() {
  // Check previous beat result: mark wrong if not hit during beat
  if (currentBeatIndex >= 0 && !noteEvaluated) {
    activeNotes[currentBeatIndex].status = 'wrong';
    wrongCount++;
    updateScoreboard();
    renderScore();
  }
  
  currentBeatIndex++;
  noteEvaluated = false;
  pitchHoldCounter = 0;

  // Handle bar recycling and smooth transitions:
  if (currentBeatIndex >= 12) { // Finished Bar 3 -> Back to Bar 1 (Beat 0)
    currentBeatIndex = 0;
    regenerateBar(1); // Regenerate Bar 2 on returning to Bar 1
  } else if (currentBeatIndex === 2) { // Beat 2 of Bar 1
    regenerateBar(2); // Regenerate Bar 3
  } else if (currentBeatIndex === 8) { // Beat 8 (Start of Bar 3)
    regenerateBar(0); // Regenerate Bar 1
  }

  // Update cursor position
  if (noteXPositions[currentBeatIndex] !== undefined) {
    cursor.style.left = `${noteXPositions[currentBeatIndex] - 14}px`;
  }

  playClick();
}

function getSoundingFrequency(writtenFreq) {
  return instrumentSelect.value === "Bb" 
    ? writtenFreq * Math.pow(2, -2 / 12) 
    : writtenFreq;
}

function renderScore() {
  const div = document.getElementById("notation");
  div.innerHTML = "";
  noteXPositions = [];

  const widthPerBar = 250;
  const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
  renderer.resize(widthPerBar * 3 + 40, 150);
  const context = renderer.getContext();

  for (let bar = 0; bar < 3; bar++) {
    const group = context.openGroup();
    group.id = `bar-group-${bar}`;
    
    if (bar === animatingBar) {
      group.classList.add('bar-animating');
    }

    const xPos = 10 + (bar * widthPerBar);
    const stave = new VF.Stave(xPos, 10, widthPerBar);
    
    if (bar === 0) stave.addClef("treble");
    stave.setContext(context).draw();

    const barNotes = activeNotes.slice(bar * 4, (bar * 4) + 4);
    const staveNotes = barNotes.map(n => {
      const sn = new VF.StaveNote({
        clef: "treble",
        keys: [n.key],
        duration: "q"
      });

      // Color coding notes based on correctness
      if (n.status === "correct") {
        sn.setStyle({ fillStyle: "#22c55e", strokeStyle: "#22c55e" });
      } else if (n.status === "wrong") {
        sn.setStyle({ fillStyle: "#ef4444", strokeStyle: "#ef4444" });
      }

      return sn;
    });

    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
    voice.addTickables(staveNotes);

    new VF.Formatter().joinVoices([voice]).format([voice], widthPerBar - 60);
    voice.draw(context, stave);

    staveNotes.forEach(sn => {
      noteXPositions.push(xPos + sn.getAbsoluteX());
    });

    context.closeGroup();
  }
  
  animatingBar = null;

  if (currentBeatIndex >= 0 && noteXPositions[currentBeatIndex] !== undefined) {
    cursor.style.left = `${noteXPositions[currentBeatIndex] - 14}px`;
  }
}

// Autocorrelation Pitch Detection Algorithm
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.015) return -1;

  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  }

  buf = buf.slice(r1, r2);
  SIZE = buf.length;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) {
      c[i] = c[i] + buf[j] * buf[j + i];
    }
  }

  let d = 0; while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  return sampleRate / maxpos;
}

function detectPitch() {
  if (!isRunning) return;

  const buf = new Float32Array(2048);
  analyser.getFloatTimeDomainData(buf);
  const pitch = autoCorrelate(buf, audioCtx.sampleRate);

  if (pitch !== -1) {
    freqInfoEl.innerText = `Detected: ${Math.round(pitch)} Hz`;
    
    if (currentBeatIndex >= 0 && currentBeatIndex < 12 && !noteEvaluated) {
      const targetNote = activeNotes[currentBeatIndex];
      const targetFreq = getSoundingFrequency(targetNote.freq);
      
      const cents = 1200 * Math.log2(pitch / targetFreq);
      
      if (Math.abs(cents) < 50) {
        pitchHoldCounter++;
        if (pitchHoldCounter >= 5) { // Held pitch confirmed
          activeNotes[currentBeatIndex].status = 'correct';
          correctCount++;
          noteEvaluated = true;
          updateScoreboard();
          renderScore();
        }
      } else {
        pitchHoldCounter = 0;
      }
    }
  } else {
    freqInfoEl.innerText = "Detected: -- Hz";
  }

  requestAnimationFrame(detectPitch);
}
</script>
</body>
</html>
