<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brass Sight-Reading & Pitch Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      align-items: end;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #94a3b8;
      gap: 4px;
      text-align: left;
    }
    select, input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }
    button.main-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 12px;
      grid-column: span 1;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .key-info { color: var(--accent); font-size: 1.05rem; }
    .scoreboard { display: flex; gap: 20px; }
    .score-correct { color: var(--success); }
    .score-wrong { color: var(--danger); }
    .score-acc { color: var(--accent); }

    #notation-wrapper {
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      margin: 20px 0;
      padding: 10px;
      overflow-x: auto;
    }
    #notation {
      display: inline-block;
    }
    #cursor {
      position: absolute;
      width: 45px;
      height: 110px;
      top: 25px;
      left: 0;
      background: rgba(56, 189, 248, 0.25);
      border: 2px solid var(--accent);
      border-radius: 6px;
      pointer-events: none;
      transition: left 0.08s ease-out;
      display: none;
    }
    .freq-display { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    @keyframes ltrFade {
      0% {
        clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        opacity: 0.2;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
      }
    }
    .bar-animating {
      animation: ltrFade 0.45s ease-out forwards;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Brass Sight-Reading Trainer</h2>
  
  <div class="controls">
    <label>Instrument
      <select id="instrumentSelect">
        <option value="Bb">Trumpet / Cornet (B♭)</option>
        <option value="C">Trombone / Treble C</option>
      </select>
    </label>

    <label>Pattern Mode
      <select id="modeSelect">
        <option value="melodic">Melodic Steps</option>
        <option value="random">Pure Random</option>
        <option value="maj_arp">Major Arpeggios</option>
        <option value="min_arp">Minor Arpeggios</option>
        <option value="blues">Blues Scale</option>
      </select>
    </label>

    <label id="rootLabel">Root Note
      <select id="rootSelect">
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="G">G</option>
        <option value="A" selected>A</option>
        <option value="B">B</option>
      </select>
    </label>

    <label>Key Signature
      <select id="keySelect">
        <option value="C">C Major / A Minor (0 ♭/♯)</option>
        <option value="F">F Major / D Minor (1 ♭)</option>
        <option value="Bb">B♭ Major / G Minor (2 ♭)</option>
        <option value="Eb">E♭ Major / C Minor (3 ♭)</option>
        <option value="G">G Major / E Minor (1 ♯)</option>
      </select>
    </label>

    <label>Tempo (BPM): <span id="bpmVal">80</span>
      <input type="range" id="tempoSlider" min="40" max="180" value="80">
    </label>

    <button id="startBtn" class="main-btn">Start Practice</button>
  </div>

  <div class="info-bar">
    <div id="keyDisplay" class="key-info">Key: C Major (Concert)</div>
    <div class="scoreboard">
      <div>Correct: <span id="correctCnt" class="score-correct">0</span></div>
      <div>Wrong: <span id="wrongCnt" class="score-wrong">0</span></div>
      <div>Accuracy: <span id="accPct" class="score-acc">100%</span></div>
    </div>
  </div>

  <div id="notation-wrapper">
    <div id="notation"></div>
    <div id="cursor"></div>
  </div>
  
  <div id="freqInfo" class="freq-display">Detected: -- Hz</div>
</div>

<script>
const VF = Vex.Flow;

// Pitch Master Pool
const CHROMATIC_NOTES = [
  { name: "A/3", key: "a/3", freq: 220.00, acc: "" },
  { name: "Bb/3", key: "bb/3", freq: 233.08, acc: "b" },
  { name: "B/3", key: "b/3", freq: 246.94, acc: "" },
  { name: "C/4", key: "c/4", freq: 261.63, acc: "" },
  { name: "C#/4", key: "c#/4", freq: 277.18, acc: "#" },
  { name: "D/4", key: "d/4", freq: 293.66, acc: "" },
  { name: "Eb/4", key: "eb/4", freq: 311.13, acc: "b" },
  { name: "E/4", key: "e/4", freq: 329.63, acc: "" },
  { name: "F/4", key: "f/4", freq: 349.23, acc: "" },
  { name: "F#/4", key: "f#/4", freq: 369.99, acc: "#" },
  { name: "G/4", key: "g/4", freq: 392.00, acc: "" },
  { name: "Ab/4", key: "ab/4", freq: 415.30, acc: "b" },
  { name: "A/4", key: "a/4", freq: 440.00, acc: "" },
  { name: "Bb/4", key: "bb/4", freq: 466.16, acc: "b" },
  { name: "B/4", key: "b/4", freq: 493.88, acc: "" },
  { name: "C/5", key: "c/5", freq: 523.25, acc: "" },
  { name: "C#/5", key: "c#/5", freq: 554.37, acc: "#" },
  { name: "D/5", key: "d/5", freq: 587.33, acc: "" },
  { name: "Eb/5", key: "eb/5", freq: 622.25, acc: "b" },
  { name: "E/5", key: "e/5", freq: 659.25, acc: "" }
];

// Default Diatonic Pool: Low A (A3) to Third Space C (C5)
const NATURAL_NOTES = CHROMATIC_NOTES.filter(n => !n.acc);

const KEY_DETAILS = {
  "C":  { name: "C Major / A Minor", vfKey: "C" },
  "F":  { name: "F Major / D Minor (1 Flat: B♭)", vfKey: "F" },
  "Bb": { name: "B♭ Major / G Minor (2 Flats: B♭, E♭)", vfKey: "Bb" },
  "Eb": { name: "E♭ Major / C Minor (3 Flats: B♭, E♭, A♭)", vfKey: "Eb" },
  "G":  { name: "G Major / E Minor (1 Sharp: F♯)", vfKey: "G" }
};

let audioCtx, analyser, micStream;
let isRunning = false;
let metronomeTimer = null;

let activeNotes = []; // 16 note objects (4 bars x 4 beats)
let currentBeatIndex = -1;
let noteEvaluated = false;
let correctCount = 0;
let wrongCount = 0;
let pitchHoldCounter = 0;

let animatingBars = [];
let noteXPositions = [];
let lastMelodicIndex = 4;

const startBtn = document.getElementById("startBtn");
const tempoSlider = document.getElementById("tempoSlider");
const bpmVal = document.getElementById("bpmVal");
const freqInfoEl = document.getElementById("freqInfo");
const instrumentSelect = document.getElementById("instrumentSelect");
const modeSelect = document.getElementById("modeSelect");
const rootSelect = document.getElementById("rootSelect");
const keySelect = document.getElementById("keySelect");
const keyDisplay = document.getElementById("keyDisplay");
const cursor = document.getElementById("cursor");
const wrapper = document.getElementById("notation-wrapper");

tempoSlider.oninput = () => {
  bpmVal.innerText = tempoSlider.value;
  if (isRunning) resetMetronome();
};

keySelect.onchange = () => {
  keyDisplay.innerText = `Key: ${KEY_DETAILS[keySelect.value].name}`;
  if (isRunning) {
    generateInitialNotes();
    renderScore();
  }
};

modeSelect.onchange = () => {
  const isArpOrBlues = ["maj_arp", "min_arp", "blues"].includes(modeSelect.value);
  rootSelect.parentElement.style.opacity = isArpOrBlues ? "1" : "0.4";
};

startBtn.onclick = async () => {
  if (isRunning) {
    stopApp();
  } else {
    await startApp();
  }
};

async function startApp() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    
    isRunning = true;
    startBtn.innerText = "Stop";
    startBtn.style.background = "var(--danger)";
    cursor.style.display = "block";
    
    resetStats();
    generateInitialNotes();
    renderScore();
    
    currentBeatIndex = -1;
    resetMetronome();
    detectPitch();
  } catch (err) {
    alert("Microphone access is required for pitch detection.");
  }
}

function stopApp() {
  isRunning = false;
  if (metronomeTimer) clearInterval(metronomeTimer);
  if (micStream) micStream.getTracks().forEach(track => track.stop());
  if (audioCtx) audioCtx.close();
  
  startBtn.innerText = "Start Practice";
  startBtn.style.background = "var(--accent)";
  cursor.style.display = "none";
  freqInfoEl.innerText = "Detected: -- Hz";
}

function resetStats() {
  correctCount = 0;
  wrongCount = 0;
  updateScoreboard();
}

function updateScoreboard() {
  document.getElementById("correctCnt").innerText = correctCount;
  document.getElementById("wrongCnt").innerText = wrongCount;
  const total = correctCount + wrongCount;
  const pct = total === 0 ? 100 : Math.round((correctCount / total) * 100);
  document.getElementById("accPct").innerText = `${pct}%`;
}

// NOTE GENERATORS
function getNextNote() {
  const mode = modeSelect.value;
  let noteObj;

  if (mode === "random") {
    noteObj = NATURAL_NOTES[Math.floor(Math.random() * NATURAL_NOTES.length)];
  } else if (mode === "melodic") {
    const roll = Math.random();
    let step = roll < 0.70 ? (Math.random() < 0.5 ? 1 : -1) : (roll < 0.90 ? (Math.random() < 0.5 ? 2 : -2) : (Math.random() < 0.5 ? 3 : -3));
    let nextIdx = lastMelodicIndex + step;
    if (nextIdx < 0) nextIdx = 1;
    if (nextIdx >= NATURAL_NOTES.length) nextIdx = NATURAL_NOTES.length - 2;
    lastMelodicIndex = nextIdx;
    noteObj = NATURAL_NOTES[nextIdx];
  } else {
    // Arpeggio & Blues generator using full CHROMATIC_NOTES
    const rootLetter = rootSelect.value;
    const rootPitches = CHROMATIC_NOTES.filter(n => n.name.startsWith(rootLetter));
    const baseIdx = CHROMATIC_NOTES.indexOf(rootPitches[0] || CHROMATIC_NOTES[0]);
    
    let intervals = [];
    if (mode === "maj_arp") intervals = [0, 4, 7, 12, 7, 4];
    else if (mode === "min_arp") intervals = [0, 3, 7, 12, 7, 3];
    else if (mode === "blues") intervals = [0, 3, 5, 6, 7, 10, 12];

    const chosenInterval = intervals[Math.floor(Math.random() * intervals.length)];
    let targetIdx = baseIdx + chosenInterval;
    if (targetIdx >= CHROMATIC_NOTES.length) targetIdx = baseIdx;
    noteObj = CHROMATIC_NOTES[targetIdx];
  }

  return { ...noteObj, status: 'pending' };
}

function generateInitialNotes() {
  activeNotes = [];
  lastMelodicIndex = 4;
  for (let i = 0; i < 16; i++) {
    activeNotes.push(getNextNote());
  }
}

function regenerateBars(barIndices) {
  barIndices.forEach(barIdx => {
    for (let i = 0; i < 4; i++) {
      activeNotes[barIdx * 4 + i] = getNextNote();
    }
  });
  animatingBars = barIndices;
  renderScore();
}

function resetMetronome() {
  if (metronomeTimer) clearInterval(metronomeTimer);
  const intervalMs = (60 / parseInt(tempoSlider.value)) * 1000;
  
  advanceBeat();
  metronomeTimer = setInterval(advanceBeat, intervalMs);
}

function playClick() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = (currentBeatIndex % 4 === 0) ? 1200 : 800;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.04);
}

function advanceBeat() {
  if (currentBeatIndex >= 0 && !noteEvaluated) {
    activeNotes[currentBeatIndex].status = 'wrong';
    wrongCount++;
    updateScoreboard();
    renderScore();
  }
  
  currentBeatIndex++;
  noteEvaluated = false;
  pitchHoldCounter = 0;

  // 4-BAR REFRESH TIMINGS
  if (currentBeatIndex === 12) {
    // Entered Bar 4 (Beat 12): Regenerate Bars 1 and 2
    regenerateBars([0, 1]);
  } else if (currentBeatIndex >= 16) {
    // Loop back to Bar 1 (Beat 0): Regenerate Bar 3
    currentBeatIndex = 0;
    regenerateBars([2]);
  } else if (currentBeatIndex === 4) {
    // Finished Bar 1 (Entered Bar 2 / Beat 4): Regenerate Bar 4
    regenerateBars([3]);
  }

  updateCursor();
  playClick();
}

function updateCursor() {
  if (currentBeatIndex >= 0 && noteXPositions[currentBeatIndex] !== undefined) {
    cursor.style.left = `${noteXPositions[currentBeatIndex]}px`;
  }
}

function getSoundingFrequency(writtenFreq) {
  return instrumentSelect.value === "Bb" 
    ? writtenFreq * Math.pow(2, -2 / 12) 
    : writtenFreq;
}

function renderScore() {
  const div = document.getElementById("notation");
  div.innerHTML = "";
  noteXPositions = [];

  const widthPerBar = 240;
  const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
  renderer.resize(widthPerBar * 4 + 40, 150);
  const context = renderer.getContext();
  const currentKeySig = keySelect.value;

  for (let bar = 0; bar < 4; bar++) {
    const group = context.openGroup();
    group.id = `bar-group-${bar}`;
    
    if (animatingBars.includes(bar)) {
      group.classList.add('bar-animating');
    }

    const xPos = 10 + (bar * widthPerBar);
    const stave = new VF.Stave(xPos, 10, widthPerBar);
    
    if (bar === 0) {
      stave.addClef("treble");
      stave.addKeySignature(currentKeySig);
    }
    stave.setContext(context).draw();

    const barNotes = activeNotes.slice(bar * 4, (bar * 4) + 4);
    const staveNotes = barNotes.map(n => {
      const sn = new VF.StaveNote({
        clef: "treble",
        keys: [n.key],
        duration: "q"
      });

      if (n.acc) {
        sn.addAccidental(0, new VF.Accidental(n.acc));
      }

      if (n.status === "correct") {
        sn.setStyle({ fillStyle: "#22c55e", strokeStyle: "#22c55e" });
      } else if (n.status === "wrong") {
        sn.setStyle({ fillStyle: "#ef4444", strokeStyle: "#ef4444" });
      }

      return sn;
    });

    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
    voice.addTickables(staveNotes);

    new VF.Formatter().joinVoices([voice]).format([voice], widthPerBar - 70);
    voice.draw(context, stave);

    const wrapperRect = wrapper.getBoundingClientRect();
    staveNotes.forEach(sn => {
      const el = sn.getSVGElement();
      if (el) {
        const rect = el.getBoundingClientRect();
        const centerX = (rect.left + rect.width / 2) - wrapperRect.left - 22;
        noteXPositions.push(centerX);
      }
    });

    context.closeGroup();
  }
  
  animatingBars = [];
  updateCursor();
}

function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.015) return -1;

  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  }

  buf = buf.slice(r1, r2);
  SIZE = buf.length;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) {
      c[i] = c[i] + buf[j] * buf[j + i];
    }
  }

  let d = 0; while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  return sampleRate / maxpos;
}

function detectPitch() {
  if (!isRunning) return;

  const buf = new Float32Array(2048);
  analyser.getFloatTimeDomainData(buf);
  const pitch = autoCorrelate(buf, audioCtx.sampleRate);

  if (pitch !== -1) {
    freqInfoEl.innerText = `Detected: ${Math.round(pitch)} Hz`;
    
    if (currentBeatIndex >= 0 && currentBeatIndex < 16 && !noteEvaluated) {
      const targetNote = activeNotes[currentBeatIndex];
      const targetFreq = getSoundingFrequency(targetNote.freq);
      
      const cents = 1200 * Math.log2(pitch / targetFreq);
      
      if (Math.abs(cents) < 50) {
        pitchHoldCounter++;
        if (pitchHoldCounter >= 5) {
          activeNotes[currentBeatIndex].status = 'correct';
          correctCount++;
          noteEvaluated = true;
          updateScoreboard();
          renderScore();
        }
      } else {
        pitchHoldCounter = 0;
      }
    }
  } else {
    freqInfoEl.innerText = "Detected: -- Hz";
  }

  requestAnimationFrame(detectPitch);
}
</script>
</body>
</html>
