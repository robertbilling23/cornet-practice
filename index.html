<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brass Sight-Reading & Pitch Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }
    .container {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    h2 { margin-top: 0; font-size: 1.4rem; }
    
    /* Collapsible Controls Drawer */
    .controls-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
      transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
      overflow: hidden;
      max-height: 500px;
      opacity: 1;
    }
    .controls-panel.collapsed {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0;
      pointer-events: none;
    }
    
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      color: #94a3b8;
      gap: 4px;
      text-align: left;
    }
    select, input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      width: 100%;
    }
    button.main-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 14px;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }
    
    .info-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .key-info { color: var(--accent); font-size: 0.95rem; }
    .scoreboard { display: flex; justify-content: space-around; width: 100%; font-size: 0.9rem; }
    .score-correct { color: var(--success); }
    .score-wrong { color: var(--danger); }
    .score-acc { color: var(--accent); }

    /* Vertical Mobile Staff Wrapper */
    #notation-wrapper {
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      margin: 10px 0;
      padding: 6px;
      width: 100%;
      min-height: 480px;
    }
    #notation {
      display: block;
      width: 100%;
    }
    #cursor {
      position: absolute;
      width: 42px;
      height: 95px;
      top: 0;
      left: 0;
      background: rgba(56, 189, 248, 0.25);
      border: 2px solid var(--accent);
      border-radius: 6px;
      pointer-events: none;
      transition: left 0.08s ease-out, top 0.08s ease-out;
      display: none;
    }
    .freq-display { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .version-tag {
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Brass Sight-Reading</h2>
  
  <button id="startBtn" class="main-btn">Start Practice</button>

  <!-- Collapsible Options Drawer -->
  <div id="controlsPanel" class="controls-panel">
    <label>Instrument
      <select id="instrumentSelect">
        <option value="Bb">Trumpet / Cornet (B♭)</option>
        <option value="C">Trombone / Treble C</option>
      </select>
    </label>

    <label>Pattern Mode
      <select id="modeSelect">
        <option value="melodic">Melodic Steps</option>
        <option value="random">Pure Random</option>
        <option value="maj_arp">Major Arpeggios</option>
        <option value="min_arp">Minor Arpeggios</option>
        <option value="blues">Blues Scale</option>
      </select>
    </label>

    <label id="rootLabel">Root Note
      <select id="rootSelect">
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="G">G</option>
        <option value="A" selected>A</option>
        <option value="B">B</option>
      </select>
    </label>

    <label>Key Signature
      <select id="keySelect">
        <option value="C">C Major / A Minor (0 ♭/♯)</option>
        <option value="F">F Major / D Minor (1 ♭)</option>
        <option value="Bb">B♭ Major / G Minor (2 ♭)</option>
        <option value="Eb">E♭ Major / C Minor (3 ♭)</option>
        <option value="G">G Major / E Minor (1 ♯)</option>
      </select>
    </label>

    <label style="grid-column: span 2;">Tempo (BPM): <span id="bpmVal">80</span>
      <input type="range" id="tempoSlider" min="40" max="180" value="80">
    </label>
  </div>

  <div class="info-bar">
    <div id="keyDisplay" class="key-info">Key: C Major / A Minor</div>
    <div class="scoreboard">
      <div>Correct: <span id="correctCnt" class="score-correct">0</span></div>
      <div>Wrong: <span id="wrongCnt" class="score-wrong">0</span></div>
      <div>Accuracy: <span id="accPct" class="score-acc">100%</span></div>
    </div>
  </div>

  <div id="notation-wrapper">
    <div id="notation"></div>
    <div id="cursor"></div>
  </div>
  
  <div class="footer-bar">
    <div id="freqInfo" class="freq-display">Detected: -- Hz</div>
    <div id="versionBadge" class="version-tag">v1.6.0</div>
  </div>
</div>

<script>
const APP_VERSION = "v1.6.0";
const VF = Vex.Flow;

const CHROMATIC_NOTES = [
  { name: "A/3", key: "a/3", freq: 220.00, acc: "" },
  { name: "Bb/3", key: "bb/3", freq: 233.08, acc: "b" },
  { name: "B/3", key: "b/3", freq: 246.94, acc: "" },
  { name: "C/4", key: "c/4", freq: 261.63, acc: "" },
  { name: "C#/4", key: "c#/4", freq: 277.18, acc: "#" },
  { name: "D/4", key: "d/4", freq: 293.66, acc: "" },
  { name: "Eb/4", key: "eb/4", freq: 311.13, acc: "b" },
  { name: "E/4", key: "e/4", freq: 329.63, acc: "" },
  { name: "F/4", key: "f/4", freq: 349.23, acc: "" },
  { name: "F#/4", key: "f#/4", freq: 369.99, acc: "#" },
  { name: "G/4", key: "g/4", freq: 392.00, acc: "" },
  { name: "Ab/4", key: "ab/4", freq: 415.30, acc: "b" },
  { name: "A/4", key: "a/4", freq: 440.00, acc: "" },
  { name: "Bb/4", key: "bb/4", freq: 466.16, acc: "b" },
  { name: "B/4", key: "b/4", freq: 493.88, acc: "" },
  { name: "C/5", key: "c/5", freq: 523.25, acc: "" },
  { name: "C#/5", key: "c#/5", freq: 554.37, acc: "#" },
  { name: "D/5", key: "d/5", freq: 587.33, acc: "" },
  { name: "Eb/5", key: "eb/5", freq: 622.25, acc: "b" },
  { name: "E/5", key: "e/5", freq: 659.25, acc: "" }
];

const KEY_DETAILS = {
  "C":  { name: "C Major / A Minor", vfKey: "C", flats: [], sharps: [] },
  "F":  { name: "F Major / D Minor (1 Flat: B♭)", vfKey: "F", flats: ["b"], sharps: [] },
  "Bb": { name: "B♭ Major / G Minor (2 Flats: B♭, E♭)", vfKey: "Bb", flats: ["b", "e"], sharps: [] },
  "Eb": { name: "E♭ Major / C Minor (3 Flats: B♭, E♭, A♭)", vfKey: "Eb", flats: ["b", "e", "a"], sharps: [] },
  "G":  { name: "G Major / E Minor (1 Sharp: F♯)", vfKey: "G", flats: [], sharps: ["f"] }
};

let audioCtx = null;
let analyser = null;
let micStream = null;
let isRunning = false;
let metronomeTimer = null;

let activeNotes = [];
let currentBeatIndex = -1;
let noteEvaluated = false;
let correctCount = 0;
let wrongCount = 0;
let pitchHoldCounter = 0;

let notePositions = []; // Array of {x, y} coordinates for 16 beats
let sequenceStep = 0;
let lastMelodicIndex = 4;

const startBtn = document.getElementById("startBtn");
const controlsPanel = document.getElementById("controlsPanel");
const tempoSlider = document.getElementById("tempoSlider");
const bpmVal = document.getElementById("bpmVal");
const freqInfoEl = document.getElementById("freqInfo");
const instrumentSelect = document.getElementById("instrumentSelect");
const modeSelect = document.getElementById("modeSelect");
const rootSelect = document.getElementById("rootSelect");
const keySelect = document.getElementById("keySelect");
const keyDisplay = document.getElementById("keyDisplay");
const cursor = document.getElementById("cursor");
const wrapper = document.getElementById("notation-wrapper");

[modeSelect, rootSelect, keySelect, instrumentSelect].forEach(selectEl => {
  selectEl.addEventListener("change", () => {
    updateUIState();
    sequenceStep = 0;
    generateInitialNotes();
    renderScore();
  });
});

tempoSlider.oninput = () => {
  bpmVal.innerText = tempoSlider.value;
  if (isRunning) resetMetronome();
};

startBtn.onclick = async () => {
  if (isRunning) {
    stopApp();
  } else {
    await startApp();
  }
};

function updateUIState() {
  keyDisplay.innerText = `Key: ${KEY_DETAILS[keySelect.value].name}`;
  const isArpOrBlues = ["maj_arp", "min_arp", "blues"].includes(modeSelect.value);
  rootSelect.parentElement.style.opacity = isArpOrBlues ? "1" : "0.4";
  rootSelect.disabled = !isArpOrBlues;
}

async function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }
  if (!micStream) {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
  }
}

async function startApp() {
  try {
    await initAudio();
    isRunning = true;
    startBtn.innerText = "Stop";
    startBtn.style.background = "var(--danger)";
    
    // Collapse options panel to maximize vertical score area on mobile
    controlsPanel.classList.add("collapsed");
    
    resetStats();
    sequenceStep = 0;
    generateInitialNotes();
    renderScore();
    
    currentBeatIndex = -1;
    cursor.style.display = "block";

    resetMetronome();
    detectPitch();
  } catch (err) {
    alert("Microphone access is required for pitch detection.");
  }
}

function stopApp() {
  isRunning = false;
  if (metronomeTimer) clearInterval(metronomeTimer);
  startBtn.innerText = "Start Practice";
  startBtn.style.background = "var(--accent)";
  
  // Expand options panel again
  controlsPanel.classList.remove("collapsed");
  
  cursor.style.display = "none";
  freqInfoEl.innerText = "Detected: -- Hz";
}

function resetStats() {
  correctCount = 0;
  wrongCount = 0;
  updateScoreboard();
}

function updateScoreboard() {
  document.getElementById("correctCnt").innerText = correctCount;
  document.getElementById("wrongCnt").innerText = wrongCount;
  const total = correctCount + wrongCount;
  const pct = total === 0 ? 100 : Math.round((correctCount / total) * 100);
  document.getElementById("accPct").innerText = `${pct}%`;
}

function getFilteredNotesForKey() {
  const currentKeyInfo = KEY_DETAILS[keySelect.value];
  return CHROMATIC_NOTES.filter(n => {
    const letter = n.name[0].toLowerCase();
    if (n.acc === "b") return currentKeyInfo.flats.includes(letter);
    if (n.acc === "#") return currentKeyInfo.sharps.includes(letter);
    return !currentKeyInfo.flats.includes(letter) && !currentKeyInfo.sharps.includes(letter);
  });
}

function getNextNote() {
  const mode = modeSelect.value;
  const keyPool = getFilteredNotesForKey();
  let noteObj;

  if (mode === "random") {
    noteObj = keyPool[Math.floor(Math.random() * keyPool.length)];
  } else if (mode === "melodic") {
    const roll = Math.random();
    let step = roll < 0.70 ? (Math.random() < 0.5 ? 1 : -1) : (roll < 0.90 ? (Math.random() < 0.5 ? 2 : -2) : (Math.random() < 0.5 ? 3 : -3));
    let nextIdx = lastMelodicIndex + step;
    if (nextIdx < 0) nextIdx = 1;
    if (nextIdx >= keyPool.length) nextIdx = keyPool.length - 2;
    lastMelodicIndex = nextIdx;
    noteObj = keyPool[nextIdx];
  } else {
    const rootLetter = rootSelect.value;
    const rootPitches = CHROMATIC_NOTES.filter(n => n.name.startsWith(rootLetter));
    const baseIdx = CHROMATIC_NOTES.indexOf(rootPitches[0] || CHROMATIC_NOTES[0]);
    
    let intervals = [];
    if (mode === "maj_arp") intervals = [0, 4, 7, 12, 7, 4];
    else if (mode === "min_arp") intervals = [0, 3, 7, 12, 7, 3];
    else if (mode === "blues") intervals = [0, 3, 5, 6, 7, 10, 12, 10, 7, 6, 5, 3];

    const chosenInterval = intervals[sequenceStep % intervals.length];
    sequenceStep++;

    let targetIdx = baseIdx + chosenInterval;
    if (targetIdx >= CHROMATIC_NOTES.length) targetIdx = baseIdx;
    noteObj = CHROMATIC_NOTES[targetIdx];
  }

  return { ...noteObj, status: 'pending' };
}

function generateInitialNotes() {
  activeNotes = [];
  lastMelodicIndex = 2;
  for (let i = 0; i < 16; i++) {
    activeNotes.push(getNextNote());
  }
}

function regenerateBars(barIndices) {
  barIndices.forEach(barIdx => {
    for (let i = 0; i < 4; i++) {
      activeNotes[barIdx * 4 + i] = getNextNote();
    }
  });
  renderScore();
}

function resetMetronome() {
  if (metronomeTimer) clearInterval(metronomeTimer);
  const intervalMs = (60 / parseInt(tempoSlider.value)) * 1000;
  
  advanceBeat();
  metronomeTimer = setInterval(advanceBeat, intervalMs);
}

function playTargetTone() {
  if (!audioCtx || audioCtx.state !== "running" || currentBeatIndex < 0 || currentBeatIndex >= 16) return;
  
  const targetNote = activeNotes[currentBeatIndex];
  const targetFreq = getSoundingFrequency(targetNote.freq);

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = targetFreq;

  gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.35);
}

function advanceBeat() {
  if (currentBeatIndex >= 0 && !noteEvaluated && currentBeatIndex < 16) {
    activeNotes[currentBeatIndex].status = 'wrong';
    wrongCount++;
    updateScoreboard();
    renderScore();
  }
  
  currentBeatIndex++;
  noteEvaluated = false;
  pitchHoldCounter = 0;

  if (currentBeatIndex === 12) {
    regenerateBars([0, 1]);
  } else if (currentBeatIndex >= 16) {
    currentBeatIndex = 0;
    regenerateBars([2]);
  } else if (currentBeatIndex === 4) {
    regenerateBars([3]);
  }

  updateCursor();
  playTargetTone();
}

function updateCursor() {
  if (currentBeatIndex >= 0 && notePositions[currentBeatIndex]) {
    cursor.style.left = `${notePositions[currentBeatIndex].x}px`;
    cursor.style.top = `${notePositions[currentBeatIndex].y}px`;
  }
}

function getSoundingFrequency(writtenFreq) {
  return instrumentSelect.value === "Bb" 
    ? writtenFreq * Math.pow(2, -2 / 12) 
    : writtenFreq;
}

// Render 4 Vertical Bars Stacked Top-to-Bottom
function renderScore() {
  const div = document.getElementById("notation");
  div.innerHTML = "";
  notePositions = [];

  const containerWidth = Math.min(wrapper.clientWidth - 20, 440);
  const barHeight = 110;
  
  const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
  renderer.resize(containerWidth, barHeight * 4 + 20);
  const context = renderer.getContext();
  const currentKeySig = keySelect.value;
  const currentKeyInfo = KEY_DETAILS[currentKeySig];

  for (let bar = 0; bar < 4; bar++) {
    const yPos = 10 + (bar * barHeight);
    const stave = new VF.Stave(10, yPos, containerWidth - 20);
    
    stave.addClef("treble");
    if (bar === 0) stave.addKeySignature(currentKeySig);
    stave.setContext(context).draw();

    const barNotes = activeNotes.slice(bar * 4, (bar * 4) + 4);
    const staveNotes = barNotes.map(n => {
      const sn = new VF.StaveNote({
        clef: "treble",
        keys: [n.key],
        duration: "q"
      });

      const letter = n.name[0].toLowerCase();
      const inKeyFlat = n.acc === "b" && currentKeyInfo.flats.includes(letter);
      const inKeySharp = n.acc === "#" && currentKeyInfo.sharps.includes(letter);

      if (n.acc && !inKeyFlat && !inKeySharp) {
        sn.addAccidental(0, new VF.Accidental(n.acc));
      }

      if (n.status === "correct") {
        sn.setStyle({ fillStyle: "#22c55e", strokeStyle: "#22c55e" });
        sn.addModifier(new VF.Articulation("a|").setPosition(VF.Modifier.Position.ABOVE), 0);
      } else if (n.status === "wrong") {
        sn.setStyle({ fillStyle: "#ef4444", strokeStyle: "#ef4444" });
        sn.addModifier(new VF.Articulation("a@a").setPosition(VF.Modifier.Position.BELOW), 0);
      }

      return sn;
    });

    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
    voice.addTickables(staveNotes);

    new VF.Formatter().joinVoices([voice]).format([voice], containerWidth - 90);
    voice.draw(context, stave);

    staveNotes.forEach(sn => {
      const el = sn.getSVGElement();
      if (el) {
        const bbox = el.getBBox();
        const centerX = 10 + bbox.x + (bbox.width / 2) - 15;
        const centerY = yPos + 10;
        notePositions.push({ x: centerX, y: centerY });
      }
    });
  }
  
  updateCursor();
}

function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.015) return -1;

  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  }

  buf = buf.slice(r1, r2);
  SIZE = buf.length;

  let c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE - i; j++) {
      c[i] = c[i] + buf[j] * buf[j + i];
    }
  }

  let d = 0; while (c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) {
    if (c[i] > maxval) {
      maxval = c[i];
      maxpos = i;
    }
  }
  return sampleRate / maxpos;
}

function detectPitch() {
  if (!isRunning) return;

  const buf = new Float32Array(2048);
  analyser.getFloatTimeDomainData(buf);
  const pitch = autoCorrelate(buf, audioCtx.sampleRate);

  if (pitch !== -1) {
    freqInfoEl.innerText = `Detected: ${Math.round(pitch)} Hz`;
    
    if (currentBeatIndex >= 0 && currentBeatIndex < 16 && !noteEvaluated) {
      const targetNote = activeNotes[currentBeatIndex];
      const targetFreq = getSoundingFrequency(targetNote.freq);
      
      const cents = 1200 * Math.log2(pitch / targetFreq);
      
      if (Math.abs(cents) < 50) {
        pitchHoldCounter++;
        if (pitchHoldCounter >= 5) {
          activeNotes[currentBeatIndex].status = 'correct';
          correctCount++;
          noteEvaluated = true;
          updateScoreboard();
          renderScore();
        }
      } else {
        pitchHoldCounter = 0;
      }
    }
  } else {
    freqInfoEl.innerText = "Detected: -- Hz";
  }

  requestAnimationFrame(detectPitch);
}

// Window resize handler to adjust stave widths dynamically
window.onresize = () => renderScore();

updateUIState();
generateInitialNotes();
renderScore();
</script>
</body>
</html>
